map $http_x_forwarded_proto $roadvision_forwarded_proto {
    default $scheme;
    https https;
}

upstream roadvision_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 800m;
    client_body_timeout 300s;

    location /static/ {
        alias /srv/roadvision/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /_media_auth {
        internal;
        proxy_pass http://roadvision_web/internal/media-access/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $roadvision_forwarded_proto;
    }

    location /media/ {
        auth_request /_media_auth;
        alias /srv/roadvision/media/;
        add_header Cache-Control "private, no-store";
        limit_except GET HEAD { deny all; }
    }

    location / {
        proxy_pass http://roadvision_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $roadvision_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
