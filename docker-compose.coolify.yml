name: roadvision

x-roadvision-environment: &roadvision-environment
  ROADVISION_ENV: production
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${SERVICE_REALBASE64_64_DJANGO}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set the public hostname},localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set the public HTTPS origin}
  DJANGO_SECURE_COOKIES: "true"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
  DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-true}
  DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-false}
  DJANGO_CACHE_TABLE: roadvision_cache
  MYSQL_DATABASE: ${MYSQL_DATABASE:-roadvision}
  MYSQL_USER: ${MYSQL_USER:-roadvision}
  MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_DBUSER}
  MYSQL_HOST: db
  MYSQL_PORT: "3306"
  MYSQL_CONN_MAX_AGE: ${MYSQL_CONN_MAX_AGE:-60}
  STATIC_ROOT: /app/staticfiles
  MEDIA_ROOT: /app/media
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?Set a private media bucket}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:?Set the bucket region}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set the object-storage access key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set the object-storage secret key}
  AWS_QUERYSTRING_EXPIRE: ${AWS_QUERYSTRING_EXPIRE:-900}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
  GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
  GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
  GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
  ALLOW_PRIVATE_STREAMS: ${ALLOW_PRIVATE_STREAMS:-false}
  ANALYSIS_LEASE_SECONDS: ${ANALYSIS_LEASE_SECONDS:-300}
  ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
  LIVE_PREVIEW_INTERVAL_SECONDS: ${LIVE_PREVIEW_INTERVAL_SECONDS:-1}
  CONTINUOUS_STREAM_RECONNECT_SECONDS: ${CONTINUOUS_STREAM_RECONNECT_SECONDS:-2}
  AUTO_START_ANALYSIS_WORKER: "false"
  MODEL_MIN_MAP50: ${MODEL_MIN_MAP50:-0.50}
  MODEL_REQUIRE_LOCAL_EVALUATION: ${MODEL_REQUIRE_LOCAL_EVALUATION:-true}
  ALLOW_DETECTION_MODE: ${ALLOW_DETECTION_MODE:-true}
  DETECTION_MASK_REFINEMENT: ${DETECTION_MASK_REFINEMENT:-false}
  DETECTION_MASK_MAX_SIZE: ${DETECTION_MASK_MAX_SIZE:-192}
  MODEL_MIN_LOCAL_TEST_IMAGES: ${MODEL_MIN_LOCAL_TEST_IMAGES:-10}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ROOT_LOG_LEVEL: ${ROOT_LOG_LEVEL:-WARNING}
  DJANGO_REQUEST_LOG_LEVEL: ${DJANGO_REQUEST_LOG_LEVEL:-WARNING}

x-roadvision-app: &roadvision-app
  build:
    context: .
    target: runtime
  image: roadvision-coolify:latest
  environment:
    <<: *roadvision-environment
  restart: unless-stopped
  init: true

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-roadvision}
      MARIADB_USER: ${MYSQL_USER:-roadvision}
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_64_DBUSER}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_DBROOT}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *roadvision-app
    command: ["/app/deploy/start-web.sh"]
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/livez/', headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 60s

  analysis-worker:
    <<: *roadvision-app
    command: ["python", "manage.py", "run_video_visualizer_analysis", "--watch", "--poll-interval", "2"]
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 5m

volumes:
  db_data:
