name: roadvision

x-roadvision-app: &roadvision-app
  build:
    context: .
    target: runtime
  image: roadvision:production
  env_file:
    - ${ROADVISION_ENV_FILE:-.env.production}
  environment:
    MYSQL_ROOT_PASSWORD: ""
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
    - model_data:/app/models/registered
  restart: unless-stopped
  init: true

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *roadvision-app
    command: ["/app/deploy/start-web.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/livez/', headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 45s

  analysis-worker:
    <<: *roadvision-app
    command: ["python", "manage.py", "run_video_visualizer_analysis", "--watch", "--poll-interval", "2"]
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 5m

  training-worker:
    <<: *roadvision-app
    profiles: ["training"]
    command: ["python", "manage.py", "run_yolo_training", "--watch", "--poll-interval", "5"]
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 10m

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${ROADVISION_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/roadvision/static:ro
      - media_data:/srv/roadvision/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  media_data:
  static_data:
  model_data:
