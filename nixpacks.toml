providers = ["python", "node"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
NIXPACKS_NODE_VERSION = "22"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
ALLOW_DETECTION_MODE = "true"
DETECTION_MASK_REFINEMENT = "true"
AUTO_REGISTER_BUNDLED_MODEL = "true"

[phases.setup]
# Match Node's package set so Python's LD_LIBRARY_PATH cannot load an older
# libstdc++ than Node/ICU requires (CXXABI_1.3.15).
nixpkgsArchive = "e6f23dc08d3624daab7094b701aa3954923c6bbb"
# PyMySQL does not need the provider's auto-detected native MySQL headers.
nixPkgs = ["python312", "gcc"]
aptPkgs = ["...", "curl", "wget", "ffmpeg", "libglib2.0-0"]

[phases."node:setup"]
nixpkgsArchive = "e6f23dc08d3624daab7094b701aa3954923c6bbb"

[phases.build]
dependsOn = ["install", "node:install"]
cmds = ["npm run build"]

[start]
cmd = "bash deploy/start-nixpacks.sh"
